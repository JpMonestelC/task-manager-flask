<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Leelawadee+UI&display=swap" rel="stylesheet">
    <style>
        /* Ajustar botones en dispositivos móviles */
        @media (max-width: 767px) {
            .offcanvas-body .nav-link.btn-primary {
                font-size: 14px; /* Tamaño de fuente más pequeño */
                padding: 10px 15px; /* Ajustar padding para botones más balanceados */
                width: 70px; /* Asegurarse de que ocupen todo el ancho disponible */
                text-align: center;
            }

            /* Estilos de los botones 'Sign In' y 'Log In' */
            .mobile-nav-btn {
                font-size: 14px; /* Tamaño de fuente ajustado */
                padding: 10px 15px; /* Ajustar padding */
                width: 90px; /* Asegurarse de que ocupen todo el ancho disponible */
                text-align: center;
                margin-bottom: 8px; /* Ajuste del margen entre los botones */
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md bg-light shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand text-dark fw-bold" href="#">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="TaskFlow" style="height: 40px;">
            </a>
    
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
                <div class="offcanvas-header">
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        {% if g.user %}
                        <!-- Nombre de usuario visible en todas las pantallas -->
                        <li class="nav-item d-block">
                            <span class="nav-link active text-dark" style="margin-left: 8px; margin-bottom: 6px;">{{ g.user.username }}</span>
                        </li>
                        <!-- Mostrar íconos en móvil cuando el usuario esté logueado -->
                        <li class="nav-item d-md-none">
                            <a class="nav-link btn btn-link" href="{{ url_for('todo.index') }}">
                                <img src="{{ url_for('static', filename='task.png') }}" alt="Tareas" style="height: 30px; margin-left: 10px; margin-bottom: 6px;">
                            </a>
                        </li>
                        <li class="nav-item d-md-none">
                            <a class="nav-link btn btn-link" href="{{ url_for('auth.logout') }}">
                                <img src="{{ url_for('static', filename='logout.png') }}" alt="Cerrar sesión" style="height: 30px; margin-left: 10px; margin-top: 5px;">
                            </a>
                        </li>
                        <!-- Mostrar texto normal en dispositivos más grandes -->
                        <li class="nav-item d-none d-md-block">
                            <a class="nav-link btn btn-primary" href="{{ url_for('todo.index') }}">Tasks</a>
                        </li>
                        <li class="nav-item d-none d-md-block">
                            <a class="nav-link btn btn-primary" href="{{ url_for('auth.logout') }}">Log Out</a>
                        </li>
                        {% else %}
                        <li class="nav-item">
                            <a class="nav-link btn btn-primary mobile-nav-btn" href="{{ url_for('auth.register') }}">Sign In</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link btn btn-primary mobile-nav-btn" href="{{ url_for('auth.login') }}">Log In</a>
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
